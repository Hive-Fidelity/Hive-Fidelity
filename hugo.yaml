baseURL: "https://hive-fidelity.github.io/"
title: "Hive Fidelity AI"
theme: "hugo-coder"
locale: "en"
defaultContentLanguage: "en"
enableEmoji: true

pagination:
  pagerSize: 6

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true

params:
  author: "Kirsten"
  description: "Human-AI collaborative independent research lab. Weekly Blackwell Shenanigans and day-0 model deployments."
  keywords: "blog,AI,LLM,inference,Blackwell,vLLM"
  info:
    - "agentic RFP lab"
    - "day0 deploy blog"
  avatarURL: "images/bigbee.svg"
  dateFormat: "January 2, 2006"
  since: 2026
  colorScheme: "auto"
  hideColorSchemeToggle: false
  maxSeeAlsoItems: 5
  customCSS: []
  customSCSS: []
  customJS: []
  social:
    - name: "Github"
      icon: "fa-brands fa-github fa-2x"
      weight: 1
      url: "https://github.com/Hive-Fidelity/"
    - name: "RSS"
      icon: "fa-solid fa-rss fa-2x"
      weight: 2
      url: "https://hive-fidelity.github.io/index.xml"
      rel: "alternate"
      type: "application/rss+xml"

menus:
  main:
    - name: "RFP Lab"
      weight: 1
      url: "rfp-lab/"
    - name: "Blog"
      weight: 2
      url: "posts/"
    - name: "Contact"
      weight: 3
      url: "contact/"

taxonomies:
  category: "categories"
  series: "series"
  tag: "tags"
